<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan 3 Tabel HTML</title>
</head>
<body>

    <!-- ================= TABEL 1: TABEL NORMAL ================= -->
    <h3>1. Tabel Normal (3x3)</h3>
    <table border="1" cellspacing="0" cellpadding="6">
        <tr>
            <th>1,1</th>
            <th>1,2</th>
            <th>1,3</th>
        </tr>
        <tr>
            <td>2,1</td>
            <td>2,2</td>
            <td>2,3</td>
        </tr>
        <tr>
            <td>3,1</td>
            <td>3,2</td>
            <td>3,3</td>
        </tr>
    </table>

    <br><br> <!-- Jarak antar tabel -->

    <!-- ================= TABEL 2: TABEL COLSPAN ================= -->
    <h3>2. Tabel dengan Colspan (Menggabungkan Kolom)</h3>
    <table border="1" cellspacing="0" cellpadding="6">
        <tr>
            <!-- Kolom 1,1 dan 1,2 digabung menjadi 1 sel -->
            <th>1,1</th>
            <th colspan="2">colspan="2"</th>
           
        </tr>
        <tr>
            <td>2,1</td>
            <td>2,2</td>
            <td>2,3</td>
        </tr>
        <tr>
            <td>3,1</td>
            <td>3,2</td>
            <td>3,3</td>
        </tr>
    </table>

    <br><br> <!-- Jarak antar tabel -->

    <!-- ================= TABEL 3: TABEL GABUNGAN ================= -->
    <h3>3. Tabel Kombinasi Rowspan & Colspan</h3>
    <table border="1" cellspacing="0" cellpadding="6">
        <!-- Baris Pertama -->
        <tr>
            <th rowspan="3">rowspan="3</th>
            <th colspan="2">colspan="2"</th>
        </tr>
        <!-- Baris Kedua -->
        <tr>
            <td>2,2</td>
            <td>2,3</td>
        </tr>
        <!-- Baris Ketiga -->
        <tr>
            <td>3,2</td>
            <td>3,3</td>
        </tr>
    </table>

</body>
</html>
